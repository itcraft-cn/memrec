# nfpm 打包配置（deb + rpm）
#
# 用法：
#   nfpm package -f packaging/nfpm.yaml -p deb -t release
#   nfpm package -f packaging/nfpm.yaml -p rpm -t release
#
# 版本、发布号与架构通过环境变量注入（见 scripts/package/build-packages.sh）：
#   VERSION  语义化版本，如 0.11.0（不含 -dev 后缀）
#   RELEASE  包发布号，如 0.1.dev1 / 1
#   ARCH     目标架构（amd64 / arm64），nfpm 会转换为各格式约定
#
# 说明：本配置以“系统级安装 + 用户级 systemd 服务”为模型。
# 二进制安装到 /usr/bin，用户服务单元安装到 /usr/lib/systemd/user，
# 模型下载与配置生成由用户执行 `mr-install --skip-install --skip-cargo-check --skip-service` 完成。
name: memrec
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: ${RELEASE}
section: utils
priority: optional
maintainer: Helly Guo <hellyguo@foxmail.com>
vendor: itcraft.cn
homepage: https://itcraft.cn/memrec/
license: Apache-2.0
description: |
  Local-first AI memory with project isolation — for terminal, for private use.
  MemRec provides a per-user daemon (memrecd) and a CLI (memrec) backed by a
  local RocksDB store with hybrid vector + full-text retrieval.
  .

contents:
  - src: target/release/memrec
    dst: /usr/bin/memrec
    file_info:
      mode: 0755
  - src: target/release/memrecd
    dst: /usr/bin/memrecd
    file_info:
      mode: 0755
  - src: target/release/mr-install
    dst: /usr/bin/mr-install
    file_info:
      mode: 0755
  - src: packaging/systemd/memrecd.service
    dst: /usr/lib/systemd/user/memrecd.service
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/memrec/README.md
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/memrec/LICENSE
    file_info:
      mode: 0644

# 运行时依赖：libc / libgcc / libstdc++ / OpenSSL / zlib / zstd
# 与 ldd 结果一致（memrecd 静态链接了 ONNX Runtime，无额外动态依赖）。
overrides:
  deb:
    depends:
      - libc6
      - libgcc-s1
      - libstdc++6
      - libssl3 | libssl1.1
      - zlib1g
      - libzstd1
  rpm:
    depends:
      - glibc
      - libgcc
      - libstdc++
      - openssl-libs
      - zlib
      - libzstd

scripts:
  postinstall: packaging/scripts/postinstall.sh
  postremove: packaging/scripts/postremove.sh
