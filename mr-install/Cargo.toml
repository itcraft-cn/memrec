[package]
name = "mr-install"
version = "0.10.0-dev" # managed by updgitver
edition = "2021"
authors = ["Helly Guo <hellyguo@foxmail.com>"]
homepage = "https://itcraft.cn/memrec/"
repository = "https://github.com/itcraft-cn/memrec"
license = "Apache-2.0"
readme = "README.md"
description = "Installer for MemRec — Local-first AI memory with project isolation"
categories = ["command-line-utilities"]
documentation = "https://docs.rs/crate/memrec/latest"
keywords = ["Local", "Isolation", "Memory"]

[[bin]]
name = "mr-install"
path = "src/main.rs"

[dependencies]
mr-common = { path = "../mr-common", version = "0.9.0-dev" } # managed by updgitver
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
dirs.workspace = true
toml.workspace = true
indicatif.workspace = true
reqwest.workspace = true
futures-util.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
tempfile.workspace = true
