[package]
name = "memrecd"
version = "0.6.0" # managed by updgitver
edition = "2021"
authors = ["Helly Guo <hellyguo@foxmail.com>"]
homepage = "https://itcraft.cn/memrec/"
repository = "https://github.com/itcraft-cn/memrec"
license = "Apache-2.0"
readme = "README.md"
description = "Local-first AI memory with project isolation — for terminal, for private use"
categories = ["command-line-utilities"]
documentation = "https://docs.rs/crate/memrec/latest"
keywords = ["Local", "Isolation", "Memory"]

[[bin]]
name = "memrecd"
path = "src/main.rs"

[lib]
name = "memrecd"
path = "src/lib.rs"

[dependencies]
mr-common = { path = "../mr-common", version = "0.6.0" } # managed by updgitver
mr-ability = { path = "../mr-ability", version = "0.6.0" } # managed by updgitver
mr-protocol = { path = "../mr-protocol", version = "0.6.0" } # managed by updgitver
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true