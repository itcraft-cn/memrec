[workspace]
members = ["mr-common", "mr-protocol", "mr-ability", "memrecd", "memrec", "mr-install"]
resolver = "2"

[workspace.package]
version = "0.8.0" # managed by updgitver
authors = ["Helly Guo <hellyguo@foxmail.com>"]
edition = "2021"
homepage = "https://itcraft.cn/memrec/"
repository = "https://github.com/itcraft-cn/memrec"
license = "Apache-2.0"
readme = "README.md"
description = "Local-first AI memory with project isolation — for terminal, for private use"
categories = ["command-line-utilities"]
documentation = "https://docs.rs/crate/memrec/latest"
keywords = ["Local", "Isolation", "Memory"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
fastembed = { version = "5", features = ["hf-hub"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "color"] }
dirs = "5"
toml = "0.8"
indicatif = "0.17"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
rocksdb = "0.22"
tracing = "0.1"
async-trait = "0.1"
tantivy = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
tempfile = "3"
