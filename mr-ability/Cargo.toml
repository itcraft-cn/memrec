[package]
name = "mr-ability"
version = "0.6.0" # managed by updgitver
edition = "2021"
authors = ["Helly Guo <hellyguo@foxmail.com>"]
homepage = "https://itcraft.cn/memrec/"
repository = "https://github.com/itcraft-cn/memrec"
license = "Apache-2.0"
readme = "README.md"
description = "Core ability library for MemRec"
categories = ["command-line-utilities"]
documentation = "https://docs.rs/crate/memrec/latest"
keywords = ["Local", "Isolation", "Memory"]

[lib]
name = "mr_ability"
path = "src/lib.rs"

[dependencies]
mr-common = { path = "../mr-common", version = "0.6.0-dev" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio = { version = "1", features = ["full"] }
rocksdb = "0.22"
tracing = "0.1"
async-trait = "0.1"
dirs = "5"
fastembed.workspace = true
toml = "0.8"
tantivy = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"

[dev-dependencies]
tempfile = "3"
